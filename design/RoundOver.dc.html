<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wizard Duel — round over</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&amp;family=Cinzel:wght@600;700;900&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 960px; height: 540px; position: relative; overflow: hidden; background: #19193A; font-family: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif; color: #F3E6C4">
<div style="position: absolute; left: 0; top: 0">
<dc-import name="Arena" pose1="{{pose1}}" pose2="ko" hp1="{{hp1}}" hp2="0" win1="{{win1}}" win2="0" round="2" spells="false" hint-size="960px,540px"></dc-import>
</div>
<div style="position: absolute; inset: 0; background: rgba(11, 11, 30, 0.35)"></div>
<div style="position: absolute; left: 0; top: 176px; width: 960px; height: 132px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(90deg, rgba(21, 20, 44, 0) 0%, rgba(21, 20, 44, 0.92) 18%, rgba(21, 20, 44, 0.92) 82%, rgba(21, 20, 44, 0) 100%); border-top: 2px solid {{accent}}; border-bottom: 2px solid {{accent}}">
<span style="font-size: 15px; font-weight: 700; letter-spacing: 5px; color: #F2C879">ROUND 2</span>
<h1 style="margin: 0; font-family: 'Cinzel Decorative', 'Cinzel', Georgia, serif; font-weight: 900; font-size: 44px; line-height: 1.05; color: {{headCol}}; text-shadow: 0 3px 0 #120F22, 0 0 22px {{headGlow}}">{{headline}}</h1>
<span style="font-size: 16px; font-weight: 600; color: #F3E6C4">{{sub}}</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"result":{"editor":"enum","options":["ember","double"],"default":"ember"},"$preview":{"width":960,"height":540}}'>
class Component extends DCLogic {
  renderVals() {
    const dbl = this.props.result === 'double';
    return {
      pose1: dbl ? 'ko' : 'cast', hp1: dbl ? 0 : 34, win1: dbl ? 0 : 1,
      headline: dbl ? 'Double KO!' : 'Ember wins the round!',
      sub: dbl ? 'No point awarded · the round replays' : 'Next round begins in 3…',
      headCol: dbl ? '#F3E6C4' : '#F5C542',
      headGlow: dbl ? 'rgba(243,230,196,0.5)' : 'rgba(245,197,66,0.6)',
      accent: dbl ? '#D9DEE3' : '#C8102E'
    };
  }
}
</script>
</body>
</html>
