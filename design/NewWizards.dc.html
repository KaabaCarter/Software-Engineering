<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wizard Duel — future wizards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&amp;family=Cinzel:wght@600;700;900&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; height: 640px; box-sizing: border-box; padding: 56px; background: #15142C; font-family: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif; color: #F3E6C4; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; align-items: baseline; gap: 18px">
<h1 style="margin: 0; font-family: 'Cinzel', Georgia, serif; font-weight: 700; font-size: 34px; color: #F5C542">Future wizards · rough concepts</h1>
<span style="font-size: 17px; color: #D8CFE6">Same body, new hat, hair and palette, so all four house colors are covered with no new animation rig.</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
<sc-for list="{{wizards}}" as="w" hint-placeholder-count="2">
<div style="padding: 22px; border-radius: 12px; background: #1E1D3A; border: 1px solid #36334F; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Cinzel Decorative', 'Cinzel', Georgia, serif; font-weight: 900; font-size: 34px; color: {{w.nameCol}}">{{w.title}}</span><span style="font-size: 16px; font-weight: 600">{{w.houseLabel}} · {{w.tagline}}</span></div>
<div style="display: flex; gap: 6px"><span style="width: 28px; height: 28px; border-radius: 6px; background: {{w.c1}}; border: 1px solid rgba(255, 255, 255, 0.2)"></span><span style="width: 28px; height: 28px; border-radius: 6px; background: {{w.c2}}; border: 1px solid rgba(255, 255, 255, 0.2)"></span><span style="width: 28px; height: 28px; border-radius: 6px; background: {{w.c3}}; border: 1px solid rgba(255, 255, 255, 0.2)"></span></div>
</div>
<div style="position: relative; height: 250px; border-radius: 8px; overflow: hidden; background: #19193A">
<div style="position: absolute; left: 0; right: 0; top: 210px; bottom: 0; background: #4A4552; border-top: 2px solid #7A7388"></div>
<div style="position: absolute; left: 10px; top: 15px"><dc-import name="Wizard" house="{{w.house}}" pose="idle" facing="right" scale="1.3" hint-size="182px,215px"></dc-import></div>
<div style="position: absolute; left: 210px; top: 15px"><dc-import name="Wizard" house="{{w.house}}" pose="cast" facing="right" scale="1.3" hint-size="182px,215px"></dc-import></div>
<div style="position: absolute; left: 410px; top: 15px"><dc-import name="Wizard" house="{{w.house}}" pose="walk" facing="left" scale="1.3" hint-size="182px,215px"></dc-import></div>
</div>
<span style="font-size: 16px; color: #E6DCF0">{{w.note}}</span>
<span style="font-size: 15px; font-weight: 700; letter-spacing: 1px; color: #F2C879">Speed [TBD] · Power [TBD] · balance with the team</span>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      wizards: [
        { title: 'Quill', house: 'quill', houseLabel: 'Blue & bronze', tagline: 'Clever · precise', nameCol: '#7FA2FF', c1: '#2F5BD3', c2: '#0E1A40', c3: '#CD8B3E',
          note: 'Hat tip curls forward like a question mark; dark hair in a low bun. Bronze trim keeps the blue from blending into the night-blue walls.' },
        { title: 'Bramble', house: 'bramble', houseLabel: 'Yellow & black', tagline: 'Steady · loyal · tough', nameCol: '#FFD23F', c1: '#FFD23F', c2: '#3A302A', c3: '#2B2420',
          note: 'Dark robe with a bright yellow floppy hat and scarf, so the yellow sits at head height where players look. Curly golden hair.' }
      ]
    };
  }
}
</script>
</body>
</html>
